    fontes: [planalto, lexml]
    tribunais: [stj]
    sinais: [conflito de leis, lei aplicável, homologação de sentença estrangeira, domicílio, elemento de conexão]

  # ---------- DIREITO SOCIAL / DIFUSO ----------
