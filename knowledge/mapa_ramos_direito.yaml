      - "Lei 9.605/1998 (Crimes Ambientais)"
      - "Código Florestal — Lei 12.651/2012"
      - "Lei 9.985/2000 (SNUC)"
      - "Lei 12.305/2010 (Resíduos Sólidos)"
    fontes: [planalto, lexml]
    tribunais: [stj, stf]
